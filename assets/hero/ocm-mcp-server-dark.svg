<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 132" role="img" aria-label="ocm-mcp-server">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .xs{font-size:9.5px;letter-spacing:.05em}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes ping{0%,100%{opacity:.3;r:3.4}50%{opacity:1;r:5.2}}
    @keyframes ring{0%{opacity:.6;transform:scale(.76)}70%,100%{opacity:0;transform:scale(1.22)}}
    @keyframes shut{0%,42%{transform:translateY(-6px)}54%,100%{transform:translateY(0)}}
    @keyframes arc{from{stroke-dashoffset:150.8}to{stroke-dashoffset:0}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes caret{0%,45%{opacity:1}55%,100%{opacity:0}}
    @keyframes draw{from{opacity:0;transform:translateX(-5px)}to{opacity:.8;transform:translateX(0)}}
    @keyframes fade{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes glow{0%,100%{opacity:.16}50%{opacity:.34}}
    .bob{animation:bob 3.6s ease-in-out infinite}
    .ping{animation:ping 2s ease-in-out infinite}
    .ring{animation:ring 2.8s ease-out infinite;transform-origin:0 0}
    .shackle{animation:shut 4.2s ease-in-out infinite}
    .arc{animation:arc 2.6s cubic-bezier(.22,.9,.3,1) both}
    .sp{animation:spin 12s linear infinite;transform-origin:0 0}
    .caret{animation:caret 1.1s step-end infinite}
    .ln{animation:draw .7s ease-out both}
    .l1{animation-delay:.12s}.l2{animation-delay:.24s}.l3{animation-delay:.36s}
    .chip{animation:fade 4.2s ease-in-out infinite}.c1{animation-delay:1.4s}.c2{animation-delay:2.8s}
    .glow{animation:glow 4.4s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.arc{stroke-dashoffset:0}.ln{opacity:.8}}
  </style>
  <defs><radialGradient id="s-ocm-mcp-server-dark">
    <stop offset="0%" stop-color="#38bdf8" stop-opacity=".34"/>
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient></defs>
  <rect width="640" height="132" rx="14" fill="#0b1020"/>
  <circle class="glow" cx="58" cy="52" r="76" fill="url(#s-ocm-mcp-server-dark)"/>
  <g transform="translate(58 52)"><g class="bob">
      <circle class="ring" r="26" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <path d="M0 -26 L23 -17 V3 C23 17 12 24 0 29 C-12 24 -23 17 -23 3 V-17 Z" fill="#38bdf8"
            fill-opacity=".16" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round"/>
      <g class="shackle"><path d="M-7 2 v-5 a7 7 0 0 1 14 0 v5" fill="none" stroke="#e8ecf8"
         stroke-width="2.2" stroke-linecap="round" opacity=".85"/></g>
      <rect x="-8.5" y="2" width="17" height="12" rx="3" fill="#e8ecf8" opacity=".85"/>
    </g></g>
  <text x="116" y="46" class="sans" font-size="17" font-weight="700" fill="#e8ecf8">ocm-mcp-server</text>
  <text x="116" y="66" class="mono xs" fill="#93a4c8">OPEN SOURCE · APACHE-2.0</text>
  
    <g class="chip c0">
      <rect x="116" y="86" width="160" height="26" rx="8" fill="#121a30" stroke="#243154"/>
      <circle cx="132" cy="99" r="3.6" fill="#38bdf8"/>
      <text x="144" y="103" class="mono xs" fill="#93a4c8">reads free</text>
    </g>
    <g class="chip c1">
      <rect x="288" y="86" width="160" height="26" rx="8" fill="#121a30" stroke="#243154"/>
      <circle cx="304" cy="99" r="3.6" fill="#38bdf8"/>
      <text x="316" y="103" class="mono xs" fill="#93a4c8">writes signed</text>
    </g>
    <g class="chip c2">
      <rect x="460" y="86" width="160" height="26" rx="8" fill="#121a30" stroke="#243154"/>
      <circle cx="476" cy="99" r="3.6" fill="#38bdf8"/>
      <text x="488" y="103" class="mono xs" fill="#93a4c8">all traced</text>
    </g>
</svg>